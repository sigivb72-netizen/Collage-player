name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk     out/CollagePlayer-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk   out/CollagePlayer-armeabi-v7a.apk
          cp app/build/outputs/apk/release/app-universal-release.apk     out/CollagePlayer-universal.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: CollagePlayer-apks
          path: out/*.apk

      # A downloadable release on the repo's "Releases" page — easy to grab from a phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Collage Player build ${{ github.run_number }}
          body: |
            **Which file?** Almost every phone from the last ~8 years: `CollagePlayer-arm64-v8a.apk`.
            Very old 32-bit phones: `armeabi-v7a`. Not sure: `universal` (bigger, works everywhere).

            Built from `${{ github.ref_name }}` @ `${{ github.sha }}`.
          files: out/*.apk
          make_latest: true
